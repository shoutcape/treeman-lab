services:
  postgres:
    container_name: treeman-lab-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treeman_lab
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treeman_lab"]
      interval: 2s
      timeout: 2s
      retries: 15
